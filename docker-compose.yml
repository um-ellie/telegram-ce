services:
  telegram-ce:
    build: .
    image: telegram-ce:2.0
    container_name: telegram-ce

    # Interactive terminal app — attach with: docker compose run --rm telegram-ce
    stdin_open: true
    tty: true
    init: true

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    env_file:
      - .env

    volumes:
      # Persist the Telethon session so login is only needed once
      - telegram-ce-data:/app/data

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  telegram-ce-data:
